<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Color stops representing diffusion from source (orange) to distant (light blue) -->
    <radialGradient id="bggrad" cx="35%" cy="50%">
      <stop offset="0%"   stop-color="#fff3e0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f4f7fb" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bggrad)"/>

  <!-- Edges (drawn behind nodes) -->
  <g stroke="#a8bfd4" stroke-width="1.3" opacity="0.6">
    <!-- Hub to secondaries -->
    <line x1="290" y1="200" x2="130" y2="100"/>
    <line x1="290" y1="200" x2="500" y2="100"/>
    <line x1="290" y1="200" x2="90"  y2="280"/>
    <line x1="290" y1="200" x2="550" y2="280"/>
    <line x1="290" y1="200" x2="290" y2="50"/>
    <line x1="290" y1="200" x2="200" y2="330"/>
    <line x1="290" y1="200" x2="410" y2="330"/>
    <!-- Secondary to tertiary -->
    <line x1="130" y1="100" x2="90"  y2="280"/>
    <line x1="130" y1="100" x2="290" y2="50"/>
    <line x1="500" y1="100" x2="550" y2="280"/>
    <line x1="500" y1="100" x2="290" y2="50"/>
    <line x1="90"  y1="280" x2="200" y2="330"/>
    <line x1="550" y1="280" x2="410" y2="330"/>
    <line x1="200" y1="330" x2="410" y2="330"/>
    <!-- Tertiary peripheral -->
    <line x1="130" y1="100" x2="55"  y2="140"/>
    <line x1="500" y1="100" x2="640" y2="140"/>
    <line x1="290" y1="50"  x2="220" y2="20"/>
    <line x1="290" y1="50"  x2="380" y2="20"/>
    <line x1="90"  y1="280" x2="40"  y2="340"/>
    <line x1="550" y1="280" x2="660" y2="340"/>
    <line x1="200" y1="330" x2="170" y2="390"/>
    <line x1="410" y1="330" x2="460" y2="390"/>
    <!-- Far periphery -->
    <line x1="640" y1="140" x2="710" y2="90"/>
    <line x1="640" y1="140" x2="730" y2="190"/>
    <line x1="660" y1="340" x2="740" y2="310"/>
  </g>

  <!-- Diffusion color scale: orange (source) → yellow → blue (distant) -->
  <!-- Source / hub node -->
  <circle cx="290" cy="200" r="30" fill="#e65100" opacity="0.9"/>
  <circle cx="290" cy="200" r="20" fill="#ff6d00" opacity="0.7"/>

  <!-- Near nodes (early diffusion) - orange-yellow -->
  <circle cx="130" cy="100" r="16" fill="#f57c00" opacity="0.85"/>
  <circle cx="90"  cy="280" r="16" fill="#f57c00" opacity="0.85"/>
  <circle cx="290" cy="50"  r="16" fill="#fb8c00" opacity="0.85"/>

  <!-- Mid nodes (medium diffusion) - yellow -->
  <circle cx="500" cy="100" r="13" fill="#fdd835" opacity="0.8"/>
  <circle cx="200" cy="330" r="13" fill="#fdd835" opacity="0.8"/>
  <circle cx="550" cy="280" r="13" fill="#fdd835" opacity="0.8"/>
  <circle cx="410" cy="330" r="13" fill="#fdd835" opacity="0.8"/>

  <!-- Tertiary nodes (late diffusion) - light blue -->
  <g fill="#5b9bd5" opacity="0.7">
    <circle cx="55"  cy="140" r="9"/>
    <circle cx="640" cy="140" r="9"/>
    <circle cx="220" cy="20"  r="9"/>
    <circle cx="380" cy="20"  r="9"/>
    <circle cx="40"  cy="340" r="9"/>
    <circle cx="660" cy="340" r="9"/>
    <circle cx="170" cy="390" r="9"/>
    <circle cx="460" cy="390" r="9"/>
  </g>

  <!-- Distant periphery - pale blue -->
  <g fill="#2c6496" opacity="0.35">
    <circle cx="710" cy="90"  r="6"/>
    <circle cx="730" cy="190" r="6"/>
    <circle cx="740" cy="310" r="6"/>
  </g>

  <!-- Small legend -->
  <g font-family="-apple-system,sans-serif" font-size="10">
    <circle cx="690" cy="40" r="7" fill="#e65100" opacity="0.9"/>
    <text x="702" y="44" fill="#888">source</text>
    <circle cx="690" cy="60" r="7" fill="#fdd835" opacity="0.8"/>
    <text x="702" y="64" fill="#888">diffusion</text>
    <circle cx="690" cy="80" r="7" fill="#5b9bd5" opacity="0.7"/>
    <text x="702" y="84" fill="#888">distant</text>
  </g>
</svg>
