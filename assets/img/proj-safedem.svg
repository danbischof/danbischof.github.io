<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#eef2f8"/>

  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0.5 L0,6.5 L6.5,3.5 Z" fill="#2c6496" fill-opacity="0.4"/>
    </marker>
    <!-- glow filter for lightning -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════════
       ARGUER 1 — left, leaning/pointing RIGHT
       head: (252, 80)
  ══════════════════════════════════════════════ -->
  <circle cx="252" cy="80" r="14" fill="#2c6496" fill-opacity="0.68"/>
  <line x1="252" y1="94"  x2="258" y2="132" stroke="#2c6496" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.68"/>
  <line x1="255" y1="108" x2="293" y2="97"  stroke="#2c6496" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.88"/>
  <line x1="253" y1="110" x2="233" y2="97"  stroke="#2c6496" stroke-width="3"   stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="258" y1="132" x2="270" y2="165" stroke="#2c6496" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.68"/>
  <line x1="258" y1="132" x2="246" y2="163" stroke="#2c6496" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.68"/>
  <!-- speech bubble showing aggressive speech -->
  <ellipse cx="296" cy="68" rx="22" ry="13" fill="#c0580a" fill-opacity="0.12" stroke="#c0580a" stroke-width="1.5" stroke-opacity="0.45"/>
  <line x1="280" y1="77" x2="272" y2="85" stroke="#c0580a" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="296" y="72" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="bold" fill="#c0580a" fill-opacity="0.65">!!</text>

  <!-- ══════════════════════════════════════════════
       ARGUER 2 — right, leaning/pointing LEFT
       head: (460, 80)
  ══════════════════════════════════════════════ -->
  <circle cx="460" cy="80" r="14" fill="#2c6496" fill-opacity="0.68"/>
  <line x1="460" y1="94"  x2="454" y2="132" stroke="#2c6496" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.68"/>
  <line x1="457" y1="108" x2="419" y2="97"  stroke="#2c6496" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.88"/>
  <line x1="459" y1="110" x2="479" y2="97"  stroke="#2c6496" stroke-width="3"   stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="454" y1="132" x2="442" y2="165" stroke="#2c6496" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.68"/>
  <line x1="454" y1="132" x2="465" y2="163" stroke="#2c6496" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.68"/>
  <!-- speech bubble -->
  <ellipse cx="416" cy="68" rx="22" ry="13" fill="#c0580a" fill-opacity="0.12" stroke="#c0580a" stroke-width="1.5" stroke-opacity="0.45"/>
  <line x1="432" y1="77" x2="440" y2="85" stroke="#c0580a" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="416" y="72" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="bold" fill="#c0580a" fill-opacity="0.65">!!</text>

  <!-- ══════════════════════════════════════════════
       LIGHTNING BOLT — large, clear, between arguers
  ══════════════════════════════════════════════ -->
  <!-- soft glow behind bolt -->
  <ellipse cx="356" cy="100" rx="28" ry="42" fill="#e07b00" fill-opacity="0.12" filter="url(#glow)"/>
  <!-- main bolt: classic ⚡ shape, filled -->
  <path d="M368,52 L346,96 L360,96 L336,148 L372,94 L358,94 Z"
        fill="#e07b00" fill-opacity="0.82" stroke="#fff" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- second smaller bolt left of main -->
  <path d="M330,62 L320,86 L328,86 L314,110 L334,84 L326,84 Z"
        fill="#e07b00" fill-opacity="0.42" stroke="#fff" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- ══════════════════════════════════════════════
       INTERVENER — prominent, arms raised
       head: (355, 208)
  ══════════════════════════════════════════════ -->
  <circle cx="355" cy="208" r="17" fill="#2c6496" fill-opacity="0.95"/>
  <line x1="355" y1="225" x2="355" y2="266" stroke="#2c6496" stroke-width="5"   stroke-linecap="round" stroke-opacity="0.95"/>
  <!-- both arms raised in clear STOP / intervene gesture -->
  <line x1="355" y1="238" x2="326" y2="210" stroke="#2c6496" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.92"/>
  <line x1="355" y1="238" x2="384" y2="210" stroke="#2c6496" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.92"/>
  <!-- flat open palms (short horizontal bar at hand tips = stop signal) -->
  <line x1="318" y1="206" x2="334" y2="214" stroke="#2c6496" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.75"/>
  <line x1="376" y1="206" x2="392" y2="214" stroke="#2c6496" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.75"/>
  <!-- legs -->
  <line x1="355" y1="266" x2="342" y2="300" stroke="#2c6496" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.95"/>
  <line x1="355" y1="266" x2="368" y2="300" stroke="#2c6496" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.95"/>

  <!-- "NO" speech bubble from intervener pointing upward at conflict -->
  <rect x="312" y="156" width="86" height="32" rx="10" ry="10"
        fill="#2c6496" fill-opacity="0.9"/>
  <!-- tail pointing up toward conflict -->
  <polygon points="348,156 362,156 355,144" fill="#2c6496" fill-opacity="0.9"/>
  <text x="355" y="178" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="14" font-weight="700" letter-spacing="0.06em"
        fill="#ffffff">STOP</text>

  <!-- faint dashed line from intervener up to conflict zone -->
  <line x1="355" y1="144" x2="355" y2="152"
        stroke="#2c6496" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3,3"/>

  <!-- ══════════════════════════════════════════════
       COPIER 1  cx=95  head_cy=276
  ══════════════════════════════════════════════ -->
  <circle cx="95"  cy="276" r="13"  fill="#2c6496" fill-opacity="0.58"/>
  <line x1="95"  y1="289" x2="95"  y2="325" stroke="#2c6496" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.58"/>
  <line x1="95"  y1="301" x2="70"  y2="276" stroke="#2c6496" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.72"/>
  <line x1="95"  y1="301" x2="120" y2="276" stroke="#2c6496" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.72"/>
  <line x1="62"  y1="272" x2="78"  y2="280" stroke="#2c6496" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.58"/>
  <line x1="112" y1="272" x2="128" y2="280" stroke="#2c6496" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.58"/>
  <line x1="95"  y1="325" x2="83"  y2="354" stroke="#2c6496" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.58"/>
  <line x1="95"  y1="325" x2="107" y2="354" stroke="#2c6496" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.58"/>

  <!-- ══════════════════════════════════════════════
       COPIER 2  cx=192  head_cy=306
  ══════════════════════════════════════════════ -->
  <circle cx="192" cy="306" r="12"  fill="#2c6496" fill-opacity="0.52"/>
  <line x1="192" y1="318" x2="192" y2="350" stroke="#2c6496" stroke-width="3"   stroke-linecap="round" stroke-opacity="0.52"/>
  <line x1="192" y1="328" x2="170" y2="306" stroke="#2c6496" stroke-width="2.8" stroke-linecap="round" stroke-opacity="0.66"/>
  <line x1="192" y1="328" x2="214" y2="306" stroke="#2c6496" stroke-width="2.8" stroke-linecap="round" stroke-opacity="0.66"/>
  <line x1="162" y1="302" x2="178" y2="310" stroke="#2c6496" stroke-width="2.3" stroke-linecap="round" stroke-opacity="0.52"/>
  <line x1="206" y1="302" x2="222" y2="310" stroke="#2c6496" stroke-width="2.3" stroke-linecap="round" stroke-opacity="0.52"/>
  <line x1="192" y1="350" x2="181" y2="376" stroke="#2c6496" stroke-width="3"   stroke-linecap="round" stroke-opacity="0.52"/>
  <line x1="192" y1="350" x2="203" y2="376" stroke="#2c6496" stroke-width="3"   stroke-linecap="round" stroke-opacity="0.52"/>

  <!-- ══════════════════════════════════════════════
       COPIER 3  cx=568  head_cy=276
  ══════════════════════════════════════════════ -->
  <circle cx="568" cy="276" r="13"  fill="#2c6496" fill-opacity="0.58"/>
  <line x1="568" y1="289" x2="568" y2="325" stroke="#2c6496" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.58"/>
  <line x1="568" y1="301" x2="543" y2="276" stroke="#2c6496" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.72"/>
  <line x1="568" y1="301" x2="593" y2="276" stroke="#2c6496" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.72"/>
  <line x1="535" y1="272" x2="551" y2="280" stroke="#2c6496" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.58"/>
  <line x1="585" y1="272" x2="601" y2="280" stroke="#2c6496" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.58"/>
  <line x1="568" y1="325" x2="556" y2="354" stroke="#2c6496" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.58"/>
  <line x1="568" y1="325" x2="580" y2="354" stroke="#2c6496" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.58"/>

  <!-- ══════════════════════════════════════════════
       COPIER 4  cx=668  head_cy=306
  ══════════════════════════════════════════════ -->
  <circle cx="668" cy="306" r="12"  fill="#2c6496" fill-opacity="0.52"/>
  <line x1="668" y1="318" x2="668" y2="350" stroke="#2c6496" stroke-width="3"   stroke-linecap="round" stroke-opacity="0.52"/>
  <line x1="668" y1="328" x2="646" y2="306" stroke="#2c6496" stroke-width="2.8" stroke-linecap="round" stroke-opacity="0.66"/>
  <line x1="668" y1="328" x2="690" y2="306" stroke="#2c6496" stroke-width="2.8" stroke-linecap="round" stroke-opacity="0.66"/>
  <line x1="638" y1="302" x2="654" y2="310" stroke="#2c6496" stroke-width="2.3" stroke-linecap="round" stroke-opacity="0.52"/>
  <line x1="682" y1="302" x2="698" y2="310" stroke="#2c6496" stroke-width="2.3" stroke-linecap="round" stroke-opacity="0.52"/>
  <line x1="668" y1="350" x2="657" y2="376" stroke="#2c6496" stroke-width="3"   stroke-linecap="round" stroke-opacity="0.52"/>
  <line x1="668" y1="350" x2="679" y2="376" stroke="#2c6496" stroke-width="3"   stroke-linecap="round" stroke-opacity="0.52"/>

  <!-- ══════════════════════════════════════════════
       Dashed arrows: intervener → copiers
  ══════════════════════════════════════════════ -->
  <path d="M330,274 Q210,270 135,278" fill="none" stroke="#2c6496" stroke-width="1.6"
        stroke-opacity="0.32" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <path d="M335,278 Q275,285 222,303" fill="none" stroke="#2c6496" stroke-width="1.4"
        stroke-opacity="0.28" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <path d="M380,274 Q468,270 528,278" fill="none" stroke="#2c6496" stroke-width="1.6"
        stroke-opacity="0.32" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <path d="M376,278 Q490,285 638,303" fill="none" stroke="#2c6496" stroke-width="1.4"
        stroke-opacity="0.28" stroke-dasharray="5,4" marker-end="url(#arr)"/>
</svg>
